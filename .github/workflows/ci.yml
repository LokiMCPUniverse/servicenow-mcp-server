name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    
    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -e ".[dev]"
      timeout-minutes: 10
    
    - name: Run Black
      run: black src/ tests/ --check
    
    - name: Run Ruff
      run: ruff check src/ tests/
    
    - name: Run MyPy
      run: mypy src/

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    
    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -e ".[dev]"
      timeout-minutes: 10
    
    - name: Run tests
      run: |
        pytest tests/ -v --cov=servicenow_mcp --cov-report=xml --cov-report=html --cov-report=term
    
    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v4
      if: matrix.python-version == '3.11'
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
      continue-on-error: true

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'
    
    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install build
      timeout-minutes: 10
    
    - name: Build package
      run: python -m build
    
    - name: Check dist contents
      run: |
        ls -la dist/
        pip install check-wheel-contents
        check-wheel-contents dist/*.whl
      continue-on-error: true
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist-${{ github.sha }}
        path: dist/
        retention-days: 7

  test-install:
    runs-on: ${{ matrix.os }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.11", "3.12"]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: dist-${{ github.sha }}
        path: dist/
    
    - name: Install from wheel
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install dist/*.whl
      timeout-minutes: 5
    
    - name: Test CLI help
      run: |
        servicenow-mcp --help
    
    - name: Test module import
      run: |
        python -c "import servicenow_mcp; print(f'Version: {servicenow_mcp.__version__}')"
    
    - name: Test CLI with invalid config (should fail gracefully)
      shell: bash
      run: |
        servicenow-mcp --config-dir /nonexistent || echo "Expected failure - CLI handles missing config correctly"
      continue-on-error: true

  integration-test:
    runs-on: ubuntu-latest
    needs: build
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'
    
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: dist-${{ github.sha }}
        path: dist/
    
    - name: Install from wheel
      run: |
        python -m pip install --upgrade pip
        pip install dist/*.whl
    
    - name: Create test config
      run: |
        mkdir -p test_config
        cat > test_config/default.json << 'INNER_EOF'
        {
          "servicenow": {
            "instance": "test-instance",
            "username": "test_user",
            "password": "test_pass"
          }
        }
        INNER_EOF
    
    - name: Test server initialization
      run: |
        # Test that the server can initialize properly
        python -c "
        from servicenow_mcp.config import ConfigManager
        from servicenow_mcp.server import ServiceNowMCPServer
        from pathlib import Path
        
        config_manager = ConfigManager(Path('test_config'))
        config = config_manager.load()
        server = ServiceNowMCPServer(config)
        print('✓ Server initialized successfully')
        print(f'✓ Instance: {server.config.servicenow.instance}')
        print(f'✓ Enabled tools: {len(server.tools.get_enabled_tools())}')
        "
    
    - name: Test client initialization
      run: |
        # Test that the client can initialize properly
        python -c "
        from servicenow_mcp.config import ServiceNowConfig
        from servicenow_mcp.client import ServiceNowClient
        
        config = ServiceNowConfig(
            instance='test-instance',
            username='test_user',
            password='test_pass'
        )
        client = ServiceNowClient(config)
        print('✓ Client initialized successfully')
        print(f'✓ Base URL: {client.base_url}')
        assert client.base_url == 'https://test-instance.service-now.com/api/now'
        print('✓ Base URL validation passed')
        "
    
    - name: Test config validation
      run: |
        # Test config validation scenarios
        python -c "
        from servicenow_mcp.config import ServiceNowConfig
        
        # Test subdomain only
        config = ServiceNowConfig(instance='test', username='u', password='p')
        assert config.instance == 'https://test.service-now.com'
        print('✓ Subdomain-only instance validated')
        
        # Test full domain
        config = ServiceNowConfig(instance='test.service-now.com', username='u', password='p')
        assert config.instance == 'https://test.service-now.com'
        print('✓ Full domain instance validated')
        
        # Test full URL
        config = ServiceNowConfig(instance='https://test.service-now.com', username='u', password='p')
        assert config.instance == 'https://test.service-now.com'
        print('✓ Full URL instance validated')
        
        # Test trailing slash removal
        config = ServiceNowConfig(instance='https://test.service-now.com/', username='u', password='p')
        assert config.instance == 'https://test.service-now.com'
        print('✓ Trailing slash removal validated')
        "
